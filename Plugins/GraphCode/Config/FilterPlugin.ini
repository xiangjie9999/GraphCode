[FilterPlugin]
; Additional files packaged with this plugin, and files kept OUT of it. Paths are relative to the
; plugin root; "..." matches a directory tree.

; BuildPlugin's default includes Source/Resources/Content, but not the customer documentation
; or the merge-driver setup tools that those guides link to. Keep the complete customer route.
/README.md
/GRAPHCODE.md
/SETUP.md
/THIRD-PARTY-NOTICES.md
/LICENSE.XAtlas.txt
/Docs/...
/Tools/...

; ---------------------------------------------------------------------------
; THE NODE BRIDGE SHIPS; ITS DEPENDENCY TREE DOES NOT.
; ---------------------------------------------------------------------------
; MEASURED 2026-08-27: `npm install --omit=dev` is 22 MB across 3,485 files, and none of it needs
; to travel — the bridge's one runtime dependency is bundled to a single committed file at
; Resources/mcp-bridge/vendor/mcp-sdk.mjs (~700 KB), so a customer's copy starts with no
; `npm install` and no network. Excluding node_modules WITHOUT that bundle is what used to leave
; the bridge dead on arrival, and the failure was invisible: ERR_MODULE_NOT_FOUND goes into the
; stdio pipe the MCP client owns, and the client reports only that the server failed to start.
; `tests/unit/vendor-sdk.test.js` fails if the bundle goes missing or stale.
-/Resources/mcp-bridge/node_modules/...

; Development-only: the suite, its config, and the coverage it writes. A customer runs none of it.
-/Resources/mcp-bridge/tests/...
-/Resources/mcp-bridge/coverage/...
-/Resources/mcp-bridge/vitest.config.js
; An agent's call helper with a hard 10-minute wait; customers use gc_apply wait:0 (user, 2026-10-21:
; "ok, take it out of release then").
-/Resources/mcp-bridge/.claude-call.mjs

; Working files the bridge writes beside itself at runtime.
-/Resources/mcp-bridge/Saved/...

; Never package these.
-/nul
-/.claude/...
